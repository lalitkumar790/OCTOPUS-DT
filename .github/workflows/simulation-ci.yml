name: Simulation CI

permissions:
  contents: write

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: simulation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: simulation/pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,server]"
      - name: Lint and apply safe Ruff fixes
        run: |
          ruff check --fix src tests
          ruff check src tests
      - name: Commit Ruff autofixes
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src tests
            git commit -m "style(simulation): apply Ruff autofixes"
            git push
          fi
      - name: Unit tests
        run: pytest -q
      - name: MuJoCo model smoke test
        run: python -m octopus_dt.smoke_test
      - name: CAD model asset integrity
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          models = Path("models")
          cad = models / "octopus_dt_cad.xml"
          if not cad.exists():
              raise SystemExit("CAD MJCF is missing")
          root = ET.parse(cad).getroot()
          missing = [m.attrib["file"] for m in root.findall("./asset/mesh")
                     if not (models / "meshes" / m.attrib["file"]).is_file()]
          if missing:
              print(f"CAD mesh assets not installed yet ({len(missing)} missing): {missing[:3]}")
          else:
              print("All CAD mesh assets are present.")
          PY
